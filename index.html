<html lang="en">
<meta charset="utf-8">
<meta name="author" content="Dr. Arnab Purkayastha, Western New England University">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Drag-and-drop breadboard simulator for first-year electronics: Raspberry Pi Pico 2 WH, motor driver, servos, sensors, multimeter, live schematic and auto-checked wiring challenges.">
<title>Breadboard Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: workbench in three panes — parts bin | ESD-mat canvas | inspector. Stacks vertically on phones. */
:root{
  --bg:#e9eeec; --panel:#ffffff; --ink:#17201e; --muted:#5b6a66; --line:#d3dcd9; --chip:#f1f5f4;
  --mat:#c9d8d4; --matdot:#b2c6c1; --accent:#0e7468; --accent-ink:#ffffff; --accent-soft:#d5ece8;
  --warn:#a85d06; --warn-bg:#fdf1de; --bad:#bf2a20; --bad-bg:#fbe4e1; --ok:#167a3c;
  --font-ui:"Archivo", "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101716; --panel:#182120; --ink:#e3ecea; --muted:#90a29d; --line:#2a3634; --chip:#1f2a28;
  --mat:#1b2f2c; --matdot:#25403c; --accent:#3cc9b6; --accent-ink:#04211d; --accent-soft:#16413b;
  --warn:#f0a83a; --warn-bg:#3a2a12; --bad:#ff7a6e; --bad-bg:#3d1a17; --ok:#55d68a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101716; --panel:#182120; --ink:#e3ecea; --muted:#90a29d; --line:#2a3634; --chip:#1f2a28;
  --mat:#1b2f2c; --matdot:#25403c; --accent:#3cc9b6; --accent-ink:#04211d; --accent-soft:#16413b;
  --warn:#f0a83a; --warn-bg:#3a2a12; --bad:#ff7a6e; --bad-bg:#3d1a17; --ok:#55d68a; color-scheme:dark }

[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);padding-inline:16px;padding-block:10px;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:26px;height:26px}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.sep{width:1px;height:22px;background:var(--line);margin-inline:2px}
select.btn{padding-right:6px}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:0 4px}
kbd{font-family:var(--font-mono);font-size:11px;background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.main{display:grid;grid-template-columns:212px minmax(0,1fr) 300px;gap:10px;min-height:0}
.bin,.insp{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0}
.bin{padding:10px 10px 14px}
.bin h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 4px 6px;font-weight:600}
.bin h3:first-child{margin-top:2px}
.bin-group{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bin-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--chip);cursor:grab;user-select:none;touch-action:none;text-align:center;font-size:11.5px;line-height:1.2;font-weight:500}
.bin-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.bin-item svg{width:52px;height:32px;pointer-events:none}
.bin-item span{pointer-events:none}
.wirebox{border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}

.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:0;
  background-color:var(--mat);background-image:radial-gradient(var(--matdot) 1.2px,transparent 1.3px);background-size:22px 22px}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#cv text{font-family:var(--font-mono);pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:32px;height:32px;padding:0;font-size:16px;font-weight:600}
.hint{pointer-events:none;position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px;max-width:calc(100% - 70px)}
.tip{position:absolute;pointer-events:none;background:#121a19;color:#eef6f4;font:12px/1.35 var(--font-mono);padding:6px 8px;border-radius:6px;white-space:nowrap;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{color:#7fe3d3;font-weight:600}

.insp{padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
.insp h2{font-size:16px;margin:0;line-height:1.25;text-wrap:balance}
.insp .sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.insp h4{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > input[type=range]{flex:1;min-width:120px}
.val{font-family:var(--font-mono);font-size:12.5px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent)}
input[type=number],input[type=text],select.in{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
input[type=number]{width:96px;font-family:var(--font-mono);font-size:12.5px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer}
.chipb:hover{border-color:var(--accent)}
.chipb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;background:var(--chip);border-radius:8px;padding:9px 11px}
.ro dt{color:var(--muted)}
.ro dd{margin:0;font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ro dd.ok{color:var(--ok)} .ro dd.bad{color:var(--bad)} .ro dd.warn{color:var(--warn)} .ro dd.muted{color:var(--muted)}
.wl{display:flex;flex-direction:column;gap:6px}
.w{font-size:12.5px;border-radius:7px;padding:7px 9px;border-left:3px solid}
.w.warn{background:var(--warn-bg);border-color:var(--warn)}
.w.bad{background:var(--bad-bg);border-color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.help ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.help p{margin:0;font-size:13px;color:var(--muted)}
.gplist{display:flex;flex-direction:column;gap:6px}
.gp{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.gp-top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.gp-name{font-family:var(--font-mono);font-weight:600;font-size:12.5px}
.gp-name small{display:block;font-family:var(--font-ui);font-weight:400;color:var(--muted);font-size:11px}
.gp select{font-size:12px;padding:3px 4px}
.gp-read{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.gp-read.hi{color:var(--bad)} .gp-read.inhi{color:var(--ok)} .gp-read.pwm{color:var(--warn)}
.gp-code{font-family:var(--font-mono);font-size:11px;color:var(--accent);overflow-wrap:anywhere}
.gp-pwm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.gp-pwm input[type=range]{flex:1;min-width:90px}
.gp-pwm input[type=number]{width:74px}
.note{font-size:12px;color:var(--muted)}

.status{display:flex;align-items:center;gap:10px;font-size:12.5px;min-height:24px;flex-wrap:wrap}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.status .dot.warn{background:var(--warn)} .status .dot.bad{background:var(--bad)}
.status button{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.status .flash{color:var(--bad);font-weight:600}

/* SVG parts */
.part{cursor:grab}
.end{fill:transparent;stroke:transparent;cursor:crosshair}
.part:hover .end,.part.sel .end{stroke:var(--accent);stroke-width:1.6}
.end.fl{fill:#cfd5da;stroke:#59636a;stroke-width:1.2}
.flow{stroke:#fff3a0;stroke-width:2;stroke-dasharray:1.6 10.4;stroke-linecap:round;fill:none;pointer-events:none}
.cable-flow{stroke-width:1.6}
.ghost{opacity:.78}
.ghost.bad{opacity:.45}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;pointer-events:none}
.snapok{fill:none;stroke:#18b26b;stroke-width:2.5;pointer-events:none}
.snapfree{fill:none;stroke:#e08a1e;stroke-width:2;stroke-dasharray:3 3;pointer-events:none}
.snapbad{fill:rgba(220,40,30,.25);stroke:#d6261b;stroke-width:2;pointer-events:none}
.hl-strip{fill:rgba(24,178,107,.55);pointer-events:none}
.hl-net{fill:rgba(24,178,107,.22);stroke:rgba(24,178,107,.7);stroke-width:1;pointer-events:none}
.badge circle{fill:var(--bad)} .badge.warn circle{fill:var(--warn)}
.badge text{fill:#fff;font-size:10px;font-weight:700;text-anchor:middle}
.act{cursor:pointer}

/* stage + schematic split */
.stagebox{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.stagebox > .stage{flex:1 1 auto}
.schem.big{flex-basis:68%}
.schem{flex:0 0 42%;min-height:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.sch-head{display:flex;gap:12px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}
.sch-head .note.alert{color:var(--bad);font-weight:600}
#sch{flex:1 1 auto;width:100%;min-height:0;display:block}
#sch text{font-family:var(--font-mono);font-size:10px;fill:var(--ink)}
#sch .sw{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
#sch .sm{fill:var(--muted);font-size:9px}
#sch .spn{fill:var(--muted);font-size:9px}
#sch .sdes{font-weight:700}
#sch .stag{fill:var(--panel);stroke-width:1.3}
#sch .stag.sig{stroke:var(--accent)} #sch .stag.pwr{stroke:var(--bad)} #sch .stag.net{stroke:var(--muted)}
#sch .sblk{fill:var(--chip);stroke:var(--ink);stroke-width:1.4}
#sch .snc{fill:none;stroke:var(--bad);stroke-width:1.4}
#sch .snc-t{fill:var(--bad);font-size:8.5px}
#sch .sp{cursor:pointer}
#sch .shit{fill:transparent}
#sch .sch-sel .sw,#sch .sch-sel .sblk{stroke:var(--accent);stroke-width:2.6}

/* challenges card */
.chcard{position:absolute;left:10px;top:10px;width:min(340px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;z-index:4}
.chcard.min{width:auto;padding:6px 8px 6px 12px}
.ch-head{display:flex;align-items:center;gap:6px;justify-content:space-between}
.ch-head h3{margin:0;font-size:15px;line-height:1.25;text-wrap:balance}
.iconbtn{border:0;background:none;cursor:pointer;font-size:15px;color:var(--muted);padding:2px 7px;border-radius:5px;line-height:1}
.iconbtn:hover{background:var(--chip);color:var(--ink)}
.linkbtn{border:0;background:none;cursor:pointer;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.ch-sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 -2px}
.ch-list{display:flex;flex-direction:column;gap:5px}
.ch-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:13px}
.ch-item:hover{border-color:var(--accent)}
.ch-item .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.ch-item .tick.done{background:var(--ok);border-color:var(--ok)}
.lvl{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.kind{align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.kind.fix{background:var(--warn-bg);color:var(--warn)}
.ch-goal{margin:0;font-size:13px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;counter-reset:s}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 8px;font-size:13px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.steps li.pass::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.fail::before{content:"!";background:var(--bad);border-color:var(--bad);color:#fff}
.steps li.todo{color:var(--muted)}
.ch-hint{grid-column:2;background:var(--bad-bg);border-left:3px solid var(--bad);border-radius:6px;padding:6px 8px;font-size:12.5px}
.kind.measure{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.ch-ask{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ch-ask input{flex:1;min-width:0;font-family:var(--font-mono);font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--chip)}
.ch-win{background:var(--accent-soft);border-radius:8px;padding:9px 11px;font-size:13px;font-weight:500}
.ch-acts{display:flex;gap:6px;flex-wrap:wrap}
.legend{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:7px;font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--muted)}
.lbar{width:70px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(215 80% 45%),hsl(160 80% 45%),hsl(90 80% 45%),hsl(40 85% 50%),hsl(0 80% 50%))}
.lgrey{width:10px;height:8px;border-radius:3px;background:#7d8a86}

@media (max-width: 880px){
  .legend{top:auto;bottom:10px;right:54px}
  .schem{flex:none;height:360px}
  body{overflow:auto;height:auto}
  #app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .bin{display:flex;gap:10px;overflow-x:auto;padding:8px}
  .bin h3{display:none}
  .bin-group{display:flex;gap:6px}
  .bin-item{width:78px;flex:none;touch-action:pan-x}
  .wirebox{flex:none;width:150px}
  .stage{height:52vh;min-height:320px}
  .hint{display:none}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion: reduce){ .flow{stroke-dasharray:none;opacity:.6} }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="3" fill="#f2f1ea" stroke="#9aa39f"/><g fill="#3b4246"><rect x="7" y="11" width="2.4" height="2.4"/><rect x="12" y="11" width="2.4" height="2.4"/><rect x="17" y="11" width="2.4" height="2.4"/><rect x="22" y="11" width="2.4" height="2.4"/><rect x="7" y="18.5" width="2.4" height="2.4"/><rect x="12" y="18.5" width="2.4" height="2.4"/><rect x="17" y="18.5" width="2.4" height="2.4"/><rect x="22" y="18.5" width="2.4" height="2.4"/></g><path d="M8 12.2 C 12 4, 20 4, 23 12.2" stroke="#e23b3b" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <span>Breadboard Simulator</span>
    </div>
    <div class="tools">
      <button class="btn primary" id="bCh" title="Wiring challenges with automatic checking">Challenges</button>
      <span class="sep"></span>
      <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">Redo</button>
      <span class="sep"></span>
      <button class="btn" id="bRot" title="Rotate selected (R)">Rotate</button>
      <button class="btn" id="bDel" title="Delete selected (Del)">Delete</button>
      <span class="sep"></span>
      <select class="btn" id="selEx" aria-label="Load an example circuit"><option value="">Load example…</option></select>
      <label class="tog" title="Show the circuit diagram that your wiring makes"><input type="checkbox" id="cSch"> Schematic</label>
      <label class="tog" title="Reveal the metal strips under the holes, coloured by voltage"><input type="checkbox" id="cX"> Show strips</label>
      <label class="tog"><input type="checkbox" id="cFlow" checked> Current flow</label>
      <button class="btn danger" id="bClear">Clear board</button>
    </div>
  </header>

  <main class="main">
    <aside class="bin" id="bin" aria-label="Parts bin"></aside>
    <section class="stagebox" id="stagebox"><div class="stage" id="stage">
      <svg id="cv" aria-label="Breadboard workspace">
        <defs id="defs"></defs>
        <g id="world"><g id="board"></g><g id="xray"></g><g id="hl"></g><g id="parts"></g><g id="over"></g></g>
      </svg>
      <div class="tip" id="tip" hidden></div>
      <div class="chcard" id="chcard" hidden></div>
      <div class="legend" id="legend" hidden><span>Strip voltage</span><span class="lbar"></span><span>0 V → 9 V+</span><span class="lgrey"></span><span>no power</span></div>
      <div class="hint" id="hint">Drag parts from the bin. Drag from one hole to another to draw a wire. Scroll to zoom, drag empty space to pan.</div>
      <div class="zoom">
        <button class="btn" id="zIn" title="Zoom in">+</button>
        <button class="btn" id="zOut" title="Zoom out">−</button>
        <button class="btn" id="zFit" title="Fit everything" style="font-size:11px">Fit</button>
      </div>
    </div>
      <div class="schem" id="schem" hidden>
        <div class="sch-head"><b>Schematic</b><span class="note" id="schNote">Draws itself from your breadboard wiring. Labels with the same name are connected.</span><label class="tog"><input type="checkbox" id="cSchV" checked> Voltages</label><button class="btn" id="bSchBig" style="margin-left:auto;padding:3px 10px">Expand</button></div>
        <svg id="sch" preserveAspectRatio="xMidYMin meet" aria-label="Schematic generated from the breadboard"></svg>
      </div>
    </section>
    <aside class="insp" id="insp" aria-label="Inspector"></aside>
  </main>
  <footer class="status" id="status"></footer>
</div>

<script>
'use strict';
/* ================= constants & grid ================= */
const P = 20, COLS = 63;
const $ = s => document.querySelector(s);
const cv = $('#cv'), worldG = $('#world'), boardG = $('#board'), hlG = $('#hl'), partsG = $('#parts'), overG = $('#over');
const tip = $('#tip'), insp = $('#insp'), stage = $('#stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ROWL = {3:'a',4:'b',5:'c',6:'d',7:'e',10:'f',11:'g',12:'h',13:'i',14:'j'};
const isRail = r => r===0||r===1||r===16||r===17;
function isHole(c,r){ if(!Number.isInteger(c)||!Number.isInteger(r)||c<1||c>COLS) return false; if(isRail(r)) return c%6!==0; return (r>=3&&r<=7)||(r>=10&&r<=14); }
function stripKey(c,r){ return isRail(r) ? 'R'+r : (r<=7?'A':'B')+c; }
function holeName(c,r){ if(isRail(r)) return (r<2?'top ':'bottom ')+((r===0||r===16)?'+':'−')+' rail, col '+c; return ROWL[r]+c; }

/* ================= formatting ================= */
const fmtV = v => v==null||!isFinite(v) ? '—' : (Math.abs(v)<0.005?'0.00':v.toFixed(2))+' V';
function fmtI(i){ if(i==null||!isFinite(i)) return '—'; const a=Math.abs(i); if(a<1e-6) return '0 mA'; if(a<1e-3) return (i*1e6).toFixed(0)+' µA'; if(a<1) return (i*1e3).toFixed(a<0.01?2:1)+' mA'; return i.toFixed(2)+' A'; }
function fmtP(p){ const a=Math.abs(p); if(a<1) return (p*1e3).toFixed(a<0.01?2:0)+' mW'; return p.toFixed(2)+' W'; }
function fmtOhm(r){ if(r>=1e6) return +(r/1e6).toFixed(2)+' MΩ'; if(r>=1e3) return +(r/1e3).toFixed(2)+' kΩ'; return +r.toFixed(1)+' Ω'; }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= Pico pinout ================= */
const PICO_PINS=[null,'GP0','GP1','GND','GP2','GP3','GP4','GP5','GND','GP6','GP7','GP8','GP9','GND','GP10','GP11','GP12','GP13','GND','GP14','GP15',
 'GP16','GP17','GND','GP18','GP19','GP20','GP21','GND','GP22','RUN','GP26','GP27','AGND','GP28','ADC_VREF','3V3','3V3_EN','GND','VSYS','VBUS'];
const PICO_GND=[3,8,13,18,23,28,33,38];
const PICO_NUM={}; PICO_PINS.forEach((n,i)=>{ if(n && n.startsWith('GP')) PICO_NUM[n]=i; });
const GPIO_LIST=[...Array(23).keys()].map(i=>'GP'+i).concat(['GP26','GP27','GP28']);
const ADC_CH={GP26:0,GP27:1,GP28:2};
const PICO_SHORT={ADC_VREF:'VREF','3V3_EN':'3V3EN'};
const PICO_FOOT=[]; for(let n=1;n<=40;n++) PICO_FOOT.push(n<=20?[n-1,7]:[40-n,0]);
function lvl(cfg){ if(!cfg) return null; if(cfg.m==='out1') return 1; if(cfg.m==='out0') return 0; if(cfg.m==='pwm') return clamp(+cfg.d||0,0,100)/100; return null; }

/* ================= circuit element helpers ================= */
const R = (a,b,r)=>({t:'R',a,b,r});
const Vs = (p,n,v,r)=>({t:'V',p,n,v,r});
const Ev = (p,from,terms,val)=>({t:'E',p,from,terms,val});
function Diode(a,c,vf,rs){ return {a,c,vf,rs,s:{on:false},
  dyn(){ return [this.s.on ? Vs(a,c,vf,rs) : R(a,c,1e9)]; },
  upd(S){ const vd=S.v(a)-S.v(c); const on=this.s.on ? vd>=vf-1e-9 : vd>vf+1e-6; if(on!==this.s.on){this.s.on=on; return true;} return false; },
  cur(S){ const vd=S.v(a)-S.v(c); return this.s.on ? (vd-vf)/rs : vd/1e9; } }; }

function addPico(ctx, pin, props, opts={}){
  const IG = ctx.in('g');
  for(const n of PICO_GND) ctx.add(R(pin(n), IG, 0.01));
  if(props.usb){ ctx.add(Vs(pin(40), IG, 5, 0.2), 'usb'); ctx.add(Diode(pin(40), pin(39), 0.3, 0.3), 'usbd'); }
  const core = { s:{on:false},
    dyn(){ if(!this.s.on) return []; const out=[]; const b=Vs(pin(36),IG,3.3,0.3); b.tag='3V3'; out.push(b);
      for(const name of GPIO_LIST){ const cfg=props.gpio?.[name]; if(!cfg) continue; const n=pin(PICO_NUM[name]); const L=lvl(cfg); let e=null;
        if(L!==null) e=Vs(n,IG,3.3*L,40); else if(cfg.m==='pu') e=R(n,pin(36),50000); else if(cfg.m==='pd') e=R(n,IG,50000);
        if(e){ e.tag=name; out.push(e); } }
      return out; },
    upd(S){ const on = S.v(pin(39))-S.v(IG) >= 1.8; if(on!==this.s.on){ this.s.on=on; return true; } return false; } };
  ctx.add(core, 'core');
  ctx.add(R(pin(39), IG, 1e6));
  ctx.gnd(IG);
  const pc = {pid:ctx.p.id, pin, props, core, IG, embedded:!!opts.embedded};
  ctx.pico(pc); return pc;
}

function irCurve(d){ const t=[[2,1.0],[4,2.2],[6,3.05],[8,2.75],[10,2.3],[15,1.65],[20,1.3],[25,1.08],[30,0.92],[40,0.74],[50,0.61],[60,0.52],[70,0.46],[80,0.41],[100,0.35],[150,0.3]];
  if(d<=t[0][0]) return t[0][1]; for(let i=1;i<t.length;i++){ if(d<=t[i][0]){ const [x0,y0]=t[i-1],[x1,y1]=t[i]; return y0+(y1-y0)*(d-x0)/(x1-x0); } } return t[t.length-1][1]; }
const thermR = tC => 10000*Math.exp(3950*(1/(tC+273.15)-1/298.15));

/* ================= drawing helpers ================= */
const WIRES=[['#e23b3b','#931c1c','Red'],['#262626','#000000','Black'],['#2f6fe4','#1a438f','Blue'],['#2fa84f','#1a6a30','Green'],['#f2c12e','#a17d14','Yellow'],['#f08a24','#a1550e','Orange'],['#f4f4f4','#9aa3a8','White'],['#8e5bd8','#583192','Purple']];
function wireCol(c){ const w=WIRES.find(w=>w[0]===c)||WIRES[0]; return {c:w[0],d:w[1]}; }
const BAND=['#111111','#7a4a1d','#d22b2b','#f07d12','#f2d017','#1f9d3a','#1d5fd1','#7b3fc4','#8c8c8c','#f5f5f5'];
function bands(ohms){ let e=Math.floor(Math.log10(ohms))-1; let sig=Math.round(ohms/10**e); if(sig>=100){sig=Math.round(sig/10);e++;}
  const m = e>=0 ? BAND[e]||'#fff' : e===-1 ? '#c9a227' : '#b8bcc0'; return [BAND[Math.floor(sig/10)],BAND[sig%10],m,'#c9a227']; }
const LEDC={red:{vf:1.8,f:'#ff3b30',d:'#8e1a14'},yellow:{vf:2.0,f:'#ffd60a',d:'#8a7300'},green:{vf:2.1,f:'#34c759',d:'#196b2e'},blue:{vf:3.0,f:'#3d84ff',d:'#163f8a'},white:{vf:3.0,f:'#f5f8ff',d:'#9aa3b5'}};

function attPos(a){
  if(!a) return [0,0];
  if(a.k==='h') return [a.c*P, a.r*P];
  if(a.k==='f') return [a.x, a.y];
  const m=byId(a.p); if(!m) return [0,0]; const t=DEF[m.type].terms[a.i]; return [m.x+t[0], m.y+t[1]];
}
function leadGeom(p){ const a=attPos(p.ends[0]), b=attPos(p.ends[1]); const dx=b[0]-a[0], dy=b[1]-a[1]; return {a,b,L:Math.hypot(dx,dy)||1,ang:Math.atan2(dy,dx)*180/Math.PI,mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2}; }
const LN = g => `x1="${g.a[0]}" y1="${g.a[1]}" x2="${g.b[0]}" y2="${g.b[1]}"`;
function legs(g){ return `<line ${LN(g)} stroke="#6f777d" stroke-width="3.2" stroke-linecap="round"/><line ${LN(g)} stroke="#b9c0c6" stroke-width="1.8" stroke-linecap="round"/>`; }
function endDots(p){ return p.ends.map((a,i)=>{ const [x,y]=attPos(a); return `<circle class="end${a.k==='f'?' fl':''}" data-end="${p.id}:${i}" cx="${x}" cy="${y}" r="${a.k==='f'?4.5:6.5}"/>`; }).join(''); }
const flowSp = I => Math.sign(I)*(14+50*Math.min(1,Math.abs(I)/0.2));
function cablePath(o,e,dir){ const d=Math.hypot(e[0]-o[0],e[1]-o[1]); const k=Math.min(70,d*0.45); const c1=[o[0]+dir[0]*k,o[1]+dir[1]*k];
  const ux=(o[0]-e[0])/(d||1), uy=(o[1]-e[1])/(d||1); const k2=Math.min(45,d*0.3); const c2=[e[0]+ux*k2*0.4, e[1]-k2]; return `M${o[0]},${o[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${e[0]},${e[1]}`; }
function moduleCables(p, S){ const d=DEF[p.type]; let s='';
  d.leads.forEach((l,i)=>{ const o=[p.x+l.o[0], p.y+l.o[1]], e=attPos(p.ends[i]); const path=cablePath(o,e,l.dir||[0,1]);
    s+=`<path d="${path}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="4.6" stroke-linecap="round"/><path d="${path}" fill="none" stroke="${l.col}" stroke-width="3" stroke-linecap="round"/>`;
    if(showFlow && S.leadI && Math.abs(S.leadI[i]||0)>2e-4) s+=`<path class="flow cable-flow" data-sp="${flowSp(S.leadI[i])}" d="${path}"/>`;
    s+=`<rect x="${e[0]-3.5}" y="${e[1]-9}" width="7" height="9" rx="1.5" fill="#1d2124"/><circle cx="${e[0]}" cy="${e[1]}" r="2" fill="#c9cfd4"/>`; });
  return s; }
function txt(x,y,s,o={}){ return `<text x="${x}" y="${y}" font-size="${o.fs||7}" fill="${o.fill||'#fff'}" text-anchor="${o.a||'start'}"${o.w?` font-weight="${o.w}"`:''}${o.tr?` transform="${o.tr}"`:''}>${esc(s)}</text>`; }
function screw(x,y){ return `<circle cx="${x}" cy="${y}" r="7.5" fill="#cfd5da" stroke="#7b848b"/><line x1="${x-4.5}" y1="${y+2.5}" x2="${x+4.5}" y2="${y-2.5}" stroke="#6b737a" stroke-width="1.6"/>`; }
function hdrPin(x,y){ return `<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="#1a1a1a"/><rect x="${x-2}" y="${y-2}" width="4" height="4" fill="#d9b44a"/>`; }

DEF.reg = { kind:'fixed', z:1, name:'LD1117-3.3 regulator (TO-220)', short:'LD1117 3.3 V', desc:'Facing the text: pin 1 GND/ADJ, pin 2 VOUT (and tab), pin 3 VIN. 800 mA max, about 1.1 V dropout.',

  el(p,c){ const g=c.n(0), out=c.n(1), vin=c.n(2);

/* ================= analysis helpers ================= */

const CODE = (name,cfg)=>{ const num=name.replace('GP',''); if(name==='LED') return cfg.m==='out1'?'Pin("LED", Pin.OUT).on()':'Pin("LED", Pin.OUT).off()';

function analyzePico(pc, A, o){
  if(!pc) return; const {pin, props, core, IG} = pc; const on=core.s.on; o.on=on; o.gpio={}; o.gst={};
  const vrel = n => { const v=A.v(n), g=A.v(IG); return (v==null||g==null||!A.same(n,IG)) ? null : v-g; };
  o.ro.push(['Pico', on?'running · 3.3 V':'off', on?'ok':'muted']);
  if(!on) o.ro.push(['Why off', pc.embedded?'Switch the board on and connect 3–10.8 V to its power terminals':'Plug in USB, or feed 1.8–5.5 V into VSYS','muted']);
  const vs=vrel(pin(39)); if(!pc.embedded) o.ro.push(['VSYS',fmtV(vs)]);
  if(on){ const b=(core.basics||[]).find(b=>b.tag==='3V3'); if(b){ o.ro.push(['3V3 pin load',fmtI(b.I)]); if(b.I>0.3) A.warn('warn',`The 3V3 pin is supplying ${fmtI(b.I)}; keep it under about 300 mA.`); } }
  if(vs!=null && vs>5.6 && !pc.embedded) A.warn('bad',`VSYS is at ${vs.toFixed(2)} V. The Pico accepts 1.8–5.5 V there.`);
  for(const name of GPIO_LIST){ const n=pin(PICO_NUM[name]); const cfg=props.gpio?.[name]||{m:'in'}; const v=vrel(n); const L=lvl(cfg); let t, st='';
    if(L!==null){ if(!on){ t='Pico off'; } else { const b=(core.basics||[]).find(b=>b.tag===name); const i=b?b.I:0;
        t = (cfg.m==='pwm' ? `PWM ${(+cfg.d||0).toFixed(1)}% · avg ${fmtV(v)}` : `${cfg.m==='out1'?'HIGH':'LOW'} · ${fmtV(v)}`) + (Math.abs(i)>5e-5?` · ${fmtI(Math.abs(i))}`:'');
        st = cfg.m==='pwm'?'pwm':cfg.m==='out1'?'hi':'lo';
        if(Math.abs(i)>0.05) A.warn('bad',`${name} is carrying ${fmtI(Math.abs(i))}. That damages the pin; add a resistor of 220 Ω or more.`);
        else if(Math.abs(i)>0.012) A.warn('warn',`${name} is carrying ${fmtI(Math.abs(i))}. Keep each GPIO under 12 mA with a larger resistor.`); } }
    else { if(v==null) t='floating · reads random'; else { const hi=v>=2.0, lo=v<=0.8; t=(hi?'HIGH':lo?'LOW':'in-between')+' · '+fmtV(v); st=hi?'inhi':''; }

    if(v!=null && v>3.6) A.warn('bad',`${name} sees ${v.toFixed(2)} V. Pico pins take 3.3 V at most; this would damage it.`);

function servoAnalyze(p, A, o, cont){
  const g=A.node(0), vp=A.node(1), sg=A.node(2);
  const vs = A.v(vp)!=null&&A.v(g)!=null&&A.same(vp,g) ? A.v(vp)-A.v(g) : null;
  o.ro.push(['Supply (red–brown)',fmtV(vs)]); let state, target=null, speed=0;
  if(vs==null||vs<3.5) state = vs==null||vs<0.2 ? 'No power on the red and brown wires' : `Supply too low (${vs.toFixed(2)} V); needs 4.8–6 V`;
  else { let src=null, other=null;
    for(const pc of A.picos) for(const name of GPIO_LIST){ if(A.net(pc.pin(PICO_NUM[name]))===A.net(sg)){ const cfg=pc.props.gpio?.[name]; if(cfg?.m==='pwm') src={pc,cfg,name}; else other={pc,cfg,name}; } }
    if(!src) state = other ? `Orange wire is on ${other.name}, but that pin is not set to PWM` : 'No PWM signal on the orange wire';
    else if(!src.pc.core.s.on) state='The Pico making the signal is not powered';
    else if(!A.same(g,src.pc.IG) || Math.abs(A.raw(g)-A.raw(src.pc.IG))>0.3) state='No common ground. Connect the brown wire to a Pico GND';
    else { const f=+src.cfg.f||0, d=+src.cfg.d||0, us=f>0?d/100*1e6/f:0;
      o.ro.push(['Signal',`${src.name} · ${f} Hz · ${(us/1000).toFixed(2)} ms`]);
      if(f<40||f>330) state=`PWM is ${f} Hz. Servos expect 50 Hz`;
      else if(us<400||us>2600) state=`Pulse is ${(us/1000).toFixed(2)} ms. Use 0.5–2.5 ms`;
      else if(!cont){ target=clamp((us-500)/2000*180,0,180); state=`Holding ${target.toFixed(0)}°`; }
      else { speed = Math.abs(us-1500)<30 ? 0 : clamp((us-1500)/500,-1,1); state = speed===0?'Stopped (1.5 ms)':`${speed>0?'Forward':'Reverse'} ${Math.round(Math.abs(speed)*100)}%`; } } }
  if(vs!=null&&vs>7.2) A.warn('bad',`Servo supply is ${vs.toFixed(1)} V. It is rated 4.8–6 V.`);
  else if(vs!=null&&vs>=3.5&&vs<4.5) A.warn('warn','Servo supply is low. Expect weak, jittery movement.');
  o.state=state; o.vs=vs; o.ro.push(['State',state]); o.target=target; o.speed=speed*360*clamp((vs||0)/6,0,1.2);
  o.badge = target!=null ? Math.round(target)+'°' : cont&&speed ? (speed>0?'FWD ':'REV ')+Math.round(Math.abs(speed)*100)+'%' : (vs>3.5?'idle':'no power');

/* ================= MNA solver ================= */
function solveMNA(basics, gndCands){
  const idx=new Map(), nodes=[]; const add=k=>{ if(!idx.has(k)){ idx.set(k,nodes.length); nodes.push(k); } };
  for(const b of basics){ if(b.t==='R'){add(b.a);add(b.b);} else if(b.t==='V'){add(b.p);add(b.n);} else { add(b.p); add(b.from); for(const [k] of b.terms) add(k); } }
  const nN=nodes.length, par=nodes.map((_,i)=>i); const f=i=>{ while(par[i]!==i){ par[i]=par[par[i]]; i=par[i]; } return i; }; const u=(a,b)=>{ a=f(a); b=f(b); if(a!==b) par[a]=b; };
  const src=new Set();
  for(const b of basics){ if(b.t==='R') u(idx.get(b.a),idx.get(b.b)); else if(b.t==='V') u(idx.get(b.p),idx.get(b.n)); else { const p=idx.get(b.p); u(p,idx.get(b.from)); for(const [k] of b.terms) u(p,idx.get(k)); } }
  for(const b of basics){ if(b.t==='V') src.add(f(idx.get(b.p))); else if(b.t==='E') src.add(f(idx.get(b.p))); }
  const Es=basics.filter(b=>b.t==='E'), N=nN+Es.length;
  const A=Array.from({length:N},()=>new Float64Array(N)), z=new Float64Array(N);
  for(let i=0;i<nN;i++) A[i][i]+=1e-9;
  const refd=new Set();
  for(const k of gndCands){ if(!idx.has(k)) continue; const i=idx.get(k), r=f(i); if(refd.has(r)) continue; refd.add(r); A[i][i]+=1; }
  for(let i=0;i<nN;i++){ const r=f(i); if(!refd.has(r)){ refd.add(r); A[i][i]+=1; } }
  for(const b of basics){
    if(b.t==='R'){ const g=1/b.r, a=idx.get(b.a), c=idx.get(b.b); A[a][a]+=g; A[c][c]+=g; A[a][c]-=g; A[c][a]-=g; }
    else if(b.t==='V'){ const g=1/b.r, a=idx.get(b.p), c=idx.get(b.n); A[a][a]+=g; A[c][c]+=g; A[a][c]-=g; A[c][a]-=g; z[a]+=b.v*g; z[c]-=b.v*g; }
  }
  Es.forEach((b,k)=>{ const col=nN+k; A[idx.get(b.p)][col]-=1; A[idx.get(b.from)][col]+=1; for(const [n,c] of b.terms) A[col][idx.get(n)]+=c; z[col]=b.val; });
  // gaussian elimination with partial pivoting
  for(let c=0;c<N;c++){ let pv=c, mx=Math.abs(A[c][c]); for(let r=c+1;r<N;r++){ const v=Math.abs(A[r][c]); if(v>mx){mx=v;pv=r;} } if(mx<1e-18) continue;
    if(pv!==c){ const t=A[c]; A[c]=A[pv]; A[pv]=t; const tz=z[c]; z[c]=z[pv]; z[pv]=tz; }
    const Ac=A[c], d=Ac[c]; for(let r=c+1;r<N;r++){ const Ar=A[r], fct=Ar[c]/d; if(fct===0) continue; for(let k=c;k<N;k++) Ar[k]-=fct*Ac[k]; z[r]-=fct*z[c]; } }
  const x=new Float64Array(N); for(let r=N-1;r>=0;r--){ let s=z[r]; const Ar=A[r]; for(let k=r+1;k<N;k++) s-=Ar[k]*x[k]; x[r]=Math.abs(Ar[r])<1e-18?0:s/Ar[r]; }
  const V=new Map(); nodes.forEach((k,i)=>V.set(k,x[i])); Es.forEach((b,k)=>{ b.I=x[nN+k]; });
  return { V, idx, comp:k=>idx.has(k)?f(idx.get(k)):null, powered:c=>src.has(c) };
}

/* ================= simulation ================= */
function nodeOf(p,i){ const a = DEF[p.type].kind==='fixed' ? fixedPins(p)[i] : p.ends[i]; if(!a||a.k==='f') return `F${p.id}.${i}`; return a.k==='h' ? stripKey(a.c,a.r) : `T${a.p}.${a.i}`; }
function simulate(){ sim.flashes=[]; for(let pass=0;pass<6;pass++){ if(!runSim()) break; } }
function runSim(){
  const els=[], refs={}, gnd=[], picos=[];
  for(const p of parts){ const d=DEF[p.type]; if(!d.el) continue; refs[p.id]={};
    const ctx={ p, n:i=>nodeOf(p,i), t:i=>`T${p.id}.${i}`, in:s=>`I${p.id}.${s}`,
      add(e,tag){ e.pid=p.id; if(tag){ refs[p.id][tag]=e; e.key=p.id+':'+tag; const c=stateCache.get(e.key); if(c&&e.s) e.s={...c}; } els.push(e); return e; },
      gnd(n){ gnd.push(n); }, pico(o){ picos.push(o); } };
    d.el(p,ctx); }
  let V=new Map(), sol=null; const S={v:k=>V.get(k)??0};
  for(let it=0; it<80; it++){ const basics=[];
    for(const e of els){ if(e.dyn){ e.basics=e.dyn(S); basics.push(...e.basics); } else basics.push(e); }
    sol=solveMNA(basics,gnd); V=sol.V; let ch=false;
    for(const e of els) if(e.upd && e.upd(S)) ch=true;
    if(!ch) break; }
  const vv=k=>V.get(k)??0;
  const curOf=b=> b.t==='R' ? (vv(b.a)-vv(b.b))/b.r : b.t==='V' ? (b.v-(vv(b.p)-vv(b.n)))/b.r : b.I;
  for(const e of els){ if(e.basics) e.basics.forEach(b=>{ if(b.t!=='E') b.I=curOf(b); }); if(e.cur) e.I=e.cur(S); else if(!e.dyn) e.I=curOf(e); if(e.key&&e.s) stateCache.set(e.key,{...e.s}); }
  // ideal nets (wires, closed switches, ground ties)
  const np=new Map(); const nf=k=>{ let r=k; while(np.has(r)&&np.get(r)!==r) r=np.get(r); return r; }; const nu=(a,b)=>{ a=nf(a); b=nf(b); if(a!==b) np.set(a,b); };
  for(const e of els) if(e.t==='R' && e.r<=0.05) nu(e.a,e.b);
  const A0 = { picos, els, raw:vv, net:nf,
    v:k=>{ if(!sol||!sol.idx.has(k)) return null; return sol.powered(sol.comp(k)) ? V.get(k) : null; },
    same:(a,b)=> !!sol && sol.idx.has(a) && sol.idx.has(b) && sol.comp(a)===sol.comp(b) };
  const out={}, warns=[]; let burned=false;
  for(const p of parts){ const d=DEF[p.type]; const o={ro:[]}; out[p.id]=o; if(!d.an) continue;
    const A={...A0, refs:refs[p.id]||{}, node:i=>nodeOf(p,i), warn:(lv,msg)=>warns.push({pid:p.id,lv,msg}), burn:msg=>{ burned=true; sim.flashes.push({pid:p.id,msg}); }};
    d.an(p,A,o); }
  sim={...sim, V, parts:out, warns, v:A0.v, net:nf};
  return burned;
}

/* ================= geometry: fixed parts & snapping ================= */
function rotOff(dx,dy,rot){ for(let i=0;i<(rot||0);i++){ const t=dx; dx=-dy; dy=t; } return [dx,dy]; }
function fixedPins(p){ return DEF[p.type].foot.map(([dx,dy])=>{ const [a,b]=rotOff(dx,dy,p.rot); return H(p.c+a,p.r+b); }); }
function partAtts(p){ const d=DEF[p.type]; return d.kind==='fixed' ? fixedPins(p) : (p.ends||[]); }
function buildOcc(excl){ const m=new Map(); for(const p of parts){ if(p.id===excl||DEF[p.type].probe) continue; partAtts(p).forEach((a,i)=>{ const k=attKey(a); if(k) m.set(k,{p,i}); }); } return m; }
function fixedValid(p,occ){ return fixedPins(p).every(h=>isHole(h.c,h.r)&&!occ.has(attKey(h))); }
function snapPt(x,y,occ,selfId,taken,rad=12){
  let best=null, bd=rad*rad; const c0=Math.round(x/P), r0=Math.round(y/P);
  for(let c=c0-1;c<=c0+1;c++) for(let r=r0-1;r<=r0+1;r++){ if(!isHole(c,r)) continue; const k=`h${c},${r}`; if(occ.has(k)||(taken&&taken.has(k))) continue; const d=(c*P-x)**2+(r*P-y)**2; if(d<bd){ bd=d; best=H(c,r); } }
  for(const m of parts){ const d=DEF[m.type]; if(!d.terms||m.id===selfId) continue; const mm=byId(m.id);
    d.terms.forEach((t,i)=>{ const k=`t${m.id}.${i}`; if(occ.has(k)||(taken&&taken.has(k))) return; const dd=(mm.x+t[0]-x)**2+(mm.y+t[1]-y)**2; if(dd<bd){ bd=dd; best=T(m.id,i); } }); }
  return best; }

const W = (a,b,color)=>mk('wire',{ends:[a,b],props:{color}});

function deletePart(id){ const p=committed(id); if(!p) return; pushHist();
  for(const q of parts){ if(!q.ends) continue; q.ends=q.ends.map(a=> a&&a.k==='t'&&a.p===id ? (()=>{ const [x,y]=attPos(a); return F(x,y); })() : a); }
  parts=parts.filter(q=>q.id!==id); sel=null; renderInspector(); commit(); }
function rotatePart(id){ const p=committed(id); if(!p) return; const d=DEF[p.type];
  if(d.kind==='fixed'){ const occ=buildOcc(p.id); for(let k=1;k<4;k++){ const t={...p,rot:((p.rot||0)+k)%4}; if(fixedValid(t,occ)){ pushHist(); p.rot=t.rot; commit(); return; } } flash('There is no room to rotate it here.'); return; }
  if(d.kind==='lead'){ const [ax,ay]=attPos(p.ends[0]), [bx,by]=attPos(p.ends[1]); const nx=ax-(by-ay), ny=ay+(bx-ax); const occ=buildOcc(p.id); const taken=new Set([attKey(p.ends[0])].filter(Boolean));
    pushHist(); p.ends[1]=snapPt(nx,ny,occ,null,taken)||F(nx,ny); commit(); } }
function duplicatePart(id){ const p=committed(id); if(!p) return; const q=JSON.parse(JSON.stringify(p)); q.id=nextId++; const d=DEF[p.type]; const occ=buildOcc(null);
  delete q.props.broken; delete q.props.mystery;
  if(d.kind==='fixed'){ const offs=[]; for(let dc=-30;dc<=30;dc++) for(let dr=-14;dr<=14;dr++) if(dc||dr) offs.push([dc,dr]); offs.sort((a,b)=>Math.hypot(...a)-Math.hypot(...b));
    const o=offs.find(([dc,dr])=>fixedValid({...q,c:p.c+dc,r:p.r+dr},occ)); if(!o){ flash('No free space for a copy.'); return; } q.c=p.c+o[0]; q.r=p.r+o[1]; }
  else if(d.kind==='lead'){ const taken=new Set(); q.ends=p.ends.map(a=>{ const [x,y]=attPos(a); const s=snapPt(x+P,y+2*P,occ,null,taken,14); if(s){ taken.add(attKey(s)); return s; } return F(x+P,y+2*P); }); }
  else { q.x+=40; q.y+=40; q.ends=p.ends.map(a=>{ const [x,y]=attPos(a); return F(x+40,y+40); }); }
  pushHist(); parts.push(q); sel=q.id; renderInspector(); commit(); }
let flashTimer=null; function flash(msg){ sim.flashes=[{pid:null,msg}]; renderStatus(); clearTimeout(flashTimer); flashTimer=setTimeout(()=>{ sim.flashes=[]; renderStatus(); },3500); }

function renderBin(){
  let h=`<h3>Wires</h3><div class="wirebox">Drag from one hole to another to draw a wire.<div class="swatches">${WIRES.map(w=>`<button class="sw${w[0]===wireColor?' on':''}" style="background:${w[0]}" data-wc="${w[0]}" title="${w[2]} wire"></button>`).join('')}</div></div>`;
  for(const [title,list] of BIN){ h+=`<h3>${title}</h3><div class="bin-group">${list.map(t=>`<div class="bin-item" data-type="${t}" title="${esc(DEF[t].name)}"><svg viewBox="0 0 52 32">${ICON[t]}</svg><span>${esc(DEF[t].short)}</span></div>`).join('')}</div>`; }
  $('#bin').innerHTML=h;
}

/* ================= interaction ================= */
function toWorld(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-view.tx)/view.s, y:(e.clientY-r.top-view.ty)/view.s, sx:e.clientX-r.left, sy:e.clientY-r.top}; }
const pointers=new Map(); let pinch=null;

function newPartAt(type, w){ const d=DEF[type]; const tmp={id:-1, type, props:JSON.parse(JSON.stringify(d.props||{}))};
  if(d.kind==='fixed'){ const ctr=d.ctr; tmp.rot=drag?.rot||0; const [cx,cy]=rotOff(ctr[0],ctr[1],tmp.rot); tmp.c=Math.round(w.x/P-cx); tmp.r=Math.round(w.y/P-cy); }
  else if(d.kind==='lead'){ let [vx,vy]=rotOff(d.vec[0],d.vec[1],drag?.rot||0); vx*=P; vy*=P; const occ=drag?.occ||buildOcc(null); const taken=new Set();
    const e0=snapPt(w.x-vx/2,w.y-vy/2,occ,null,taken); if(e0) taken.add(attKey(e0)); const e1=snapPt(w.x+vx/2,w.y+vy/2,occ,null,taken);
    tmp.ends=[e0||F(w.x-vx/2,w.y-vy/2), e1||F(w.x+vx/2,w.y+vy/2)]; }
  else { tmp.x=Math.round(w.x-d.w/2); tmp.y=Math.round(w.y-d.h/2); tmp.ends=d.leads.map(l=>F(tmp.x+l.fl[0],tmp.y+l.fl[1])); }
  return tmp; }
function placeAtCenter(type){ const r=cv.getBoundingClientRect(); const w={x:(r.width/2-view.tx)/view.s, y:(r.height/2-view.ty)/view.s}; const d=DEF[type];
  drag={mode:'new',type,rot:0,occ:buildOcc(null)}; let p=newPartAt(type,w);
  if(d.kind==='fixed' && !fixedValid(p,drag.occ)){ const offs=[]; for(let dc=-30;dc<=30;dc++) for(let dr=-10;dr<=10;dr++) offs.push([dc,dr]); offs.sort((a,b)=>Math.hypot(...a)-Math.hypot(...b));
    const o=offs.find(([dc,dr])=>fixedValid({...p,c:p.c+dc,r:p.r+dr},drag.occ)); if(!o){ drag=null; flash('The board is full there. Move something first.'); return; } p.c+=o[0]; p.r+=o[1]; }
  drag=null; p.id=nextId++; pushHist(); parts.push(p); sel=p.id; renderInspector(); commit(); }

function startDrag(e, info){ drag={...info, sx:e.clientX, sy:e.clientY, started:false, pid:info.pid}; }
cv.addEventListener('pointerdown', e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ cancelDrag(); const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; return; }
  if(pointers.size>2) return;
  cv.setPointerCapture(e.pointerId); hideTip();
  const w=toWorld(e), t=e.target;
  if(e.button===1||e.button===2){ startDrag(e,{mode:'pan',tx0:view.tx,ty0:view.ty}); return; }
  const endEl=t.closest('[data-end]'), actEl=t.closest('[data-act]'), partEl=t.closest('[data-pid]');
  if(endEl){ const [pid,i]=endEl.dataset.end.split(':').map(Number); startDrag(e,{mode:'end',pid,i}); select(pid); return; }
  if(partEl){ const pid=+partEl.dataset.pid; const p=committed(pid); if(!p) return; select(pid); startDrag(e,{mode:'body',pid,w0:w,act:actEl?.dataset.act});
    if(p.type==='micro'){ p._pressed=true; drag.pressed=true; commit(); } return; }
  const pt=snapPt(w.x,w.y,buildOcc(null),null,null,11);
  if(pt) startDrag(e,{mode:'wire',a:pt}); else startDrag(e,{mode:'pan',tx0:view.tx,ty0:view.ty});
});
window.addEventListener('pointermove', e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size===2){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2; const r=cv.getBoundingClientRect();
    view.tx+=mx-pinch.mx; view.ty+=my-pinch.my; zoomAt(d/pinch.d, mx-r.left, my-r.top); pinch={d,mx,my}; return; }
  if(!drag){ if(e.target===cv||cv.contains(e.target)) hover(e); else { hideTip(); hlG.innerHTML=''; } return; }
  const dist=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);
  if(!drag.started){ if(dist<4) return; beginDrag(); }
  moveDrag(e);
});
window.addEventListener('pointerup', e=>{ pointers.delete(e.pointerId); if(pinch){ if(pointers.size<2) pinch=null; return; } if(drag) endDrag(e); });
window.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); pinch=null; cancelDrag(); });
cv.addEventListener('contextmenu', e=>e.preventDefault());
cv.addEventListener('pointerleave', ()=>{ if(!drag){ hideTip(); hlG.innerHTML=''; } });

function beginDrag(){ drag.started=true; hideTip(); hlG.innerHTML='';
  if(drag.mode==='body'||drag.mode==='end'){ const p=committed(drag.pid); if(drag.pressed){ p._pressed=false; drag.pressed=false; simulate(); }
    drag.orig=JSON.parse(JSON.stringify(p)); drag.preview=JSON.parse(JSON.stringify(p)); drag.occ=buildOcc(p.id);
    if(p.ends) drag.origPos=p.ends.map(a=>attPos(a)); }
  if(drag.mode==='wire'){ drag.occ=buildOcc(null); drag.preview={id:-2,type:'wire',props:{color:wireColor},ends:[drag.a,drag.a]}; }
  if(drag.mode==='new'){ drag.occ=buildOcc(null); binDragged=true; }
  stage.style.cursor='grabbing';
}
function moveDrag(e){ const w=toWorld(e);
  if(drag.mode==='pan'){ view.tx=drag.tx0+(e.clientX-drag.sx); view.ty=drag.ty0+(e.clientY-drag.sy); applyView(); return; }
  if(drag.mode==='new'){ const r=cv.getBoundingClientRect(); drag.outside = e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom; drag.lastW=w;
    drag.preview=newPartAt(drag.type,w); drag.invalid = DEF[drag.type].kind==='fixed' && !fixedValid(drag.preview,drag.occ); renderParts(); return; }
  if(drag.mode==='wire'){ const b=snapPt(w.x,w.y,drag.occ,null,new Set([attKey(drag.a)])); drag.preview.ends=[drag.a, b||F(w.x,w.y)]; drag.bSnap=b; renderParts(); return; }
  const p=drag.preview, d=DEF[p.type];
  if(drag.mode==='end'){ const taken=new Set(p.ends.map((a,j)=>j===drag.i?null:attKey(a)).filter(Boolean)); const pr=d.probe; p.ends[drag.i]=snapPt(w.x,w.y,pr?EMPTY:drag.occ,p.id,pr?null:taken)||F(w.x,w.y); renderParts(); return; }
  if(drag.mode==='body'){ const dx=w.x-drag.w0.x, dy=w.y-drag.w0.y;
    if(d.kind==='fixed'){ p.c=drag.orig.c+Math.round(dx/P); p.r=drag.orig.r+Math.round(dy/P); drag.invalid=!fixedValid(p,drag.occ); }
    else if(d.kind==='lead'){ const taken=new Set(); p.ends=drag.origPos.map(([x,y])=>{ const s=snapPt(x+dx,y+dy,drag.occ,null,taken); if(s){ taken.add(attKey(s)); return s; } return F(x+dx,y+dy); }); }
    else { p.x=Math.round(drag.orig.x+dx); p.y=Math.round(drag.orig.y+dy); p.ends=drag.orig.ends.map(a=>a.k==='f'?F(a.x+dx,a.y+dy):a); }
    renderParts(); }
}
function endDrag(e){ const dd=drag; stage.style.cursor='';
  if(!dd.started){ drag=null;
    if(dd.mode==='body'){ const p=committed(dd.pid);
      if(dd.pressed){ p._pressed=false; commit(); return; }
      if(dd.act&&dd.act.startsWith('mode:')&&p.type==='meter'){ pushHist(); p.props.mode=dd.act.slice(5); commit(); renderInspector(); return; }
      if(dd.act==='power'&&p.type==='driver'){ pushHist(); p.props.on=!p.props.on; commit(); renderInspector(); return; }
      if(p.type==='slide'){ pushHist(); p.props.pos=p.props.pos?0:1; commit(); renderInspector(); return; } }
    if(dd.mode==='pan'||dd.mode==='wire') select(null);
    return; }
  drag=null;
  if(dd.mode==='pan') return;
  if(dd.mode==='new'){ if(dd.outside||dd.invalid){ if(dd.invalid&&!dd.outside) flash('Those holes are taken or off the board. Try another spot.'); renderParts(); return; }
    const p=dd.preview; p.id=nextId++; pushHist(); parts.push(p); sel=p.id; renderInspector(); commit(); return; }
  if(dd.mode==='wire'){ if(dd.bSnap){ pushHist(); const p=mk('wire',{ends:[dd.a,dd.bSnap],props:{color:wireColor}}); parts.push(p); sel=p.id; renderInspector(); commit(); } else renderParts(); return; }
  const p=committed(dd.pid);
  if(dd.invalid){ flash('Those holes are taken or off the board, so it went back.'); renderParts(); return; }
  if(JSON.stringify(dd.preview)===JSON.stringify(dd.orig)){ renderParts(); return; }
  pushHist(); Object.assign(p, dd.preview); commit(); renderInspector();
}
function cancelDrag(){ if(!drag) return; if(drag.pressed){ const p=committed(drag.pid); if(p) p._pressed=false; } drag=null; stage.style.cursor=''; renderParts(); }

/* palette dragging */
$('#bin').addEventListener('pointerdown', e=>{
  const sw=e.target.closest('[data-wc]'); if(sw){ wireColor=sw.dataset.wc; renderBin(); return; }
  const it=e.target.closest('.bin-item'); if(!it) return; e.preventDefault();
  drag={mode:'new',type:it.dataset.type,sx:e.clientX,sy:e.clientY,started:false,rot:0,outside:true,fromBin:true};
});
let binDragged=false;
$('#bin').addEventListener('click', e=>{ const it=e.target.closest('.bin-item'); if(it && !binDragged) placeAtCenter(it.dataset.type); binDragged=false; });

/* hover */
function hover(e){
  const w=toWorld(e); let key=null, label='', node=null;
  const endEl=e.target.closest&&e.target.closest('[data-end]');
  if(endEl){ const [pid,i]=endEl.dataset.end.split(':').map(Number); const p=committed(pid); if(p){ node=nodeOf(p,i); label=`<b>${esc(DEF[p.type].short)}</b> · ${esc(DEF[p.type].pinNames[i])}`; const a=p.ends[i]; if(a.k==='h') label+=` · ${holeName(a.c,a.r)}`; if(a.k==='f') label+=' · not plugged in'; } }
  else { const pt=snapPt(w.x,w.y,EMPTY,null,null,10);
    if(pt){ if(pt.k==='h'){ node=stripKey(pt.c,pt.r); label=`<b>${holeName(pt.c,pt.r)}</b>`; } else { node=`T${pt.p}.${pt.i}`; const m=committed(pt.p); label=`<b>${esc(DEF[m.type].short)}</b> · ${esc(DEF[m.type].terms[pt.i][2])}`; }
      const occ=buildOcc(null).get(attKey(pt)); if(occ) label+=` · ${esc(DEF[occ.p.type].short)} ${esc(DEF[occ.p.type].pinNames[occ.i])}`; } }
  if(!node){ hideTip(); hlG.innerHTML=''; return; }
  const v=sim.v(node); label+=`<br>${v==null?'not powered':v.toFixed(2)+' V (vs ground)'}`;
  // highlight strip & net
  const root=sim.net(node); let s='';
  for(let r=0;r<=17;r++) for(let c=1;c<=COLS;c++){ if(!isHole(c,r)) continue; const k=stripKey(c,r); if(k===node) s+=`<rect class="hl-strip" x="${c*P-5.5}" y="${r*P-5.5}" width="11" height="11" rx="2"/>`; else if(sim.net(k)===root) s+=`<rect class="hl-net" x="${c*P-5.5}" y="${r*P-5.5}" width="11" height="11" rx="2"/>`; }
  for(const m of parts){ const d=DEF[m.type]; if(!d.terms) continue; d.terms.forEach((t,i)=>{ const k=`T${m.id}.${i}`; if(k===node||sim.net(k)===root) s+=`<circle class="${k===node?'hl-strip':'hl-net'}" cx="${m.x+t[0]}" cy="${m.y+t[1]}" r="9"/>`; }); }
  hlG.innerHTML=s;
  tip.innerHTML=label; tip.hidden=false; const r=stage.getBoundingClientRect(); let x=e.clientX-r.left+14, y=e.clientY-r.top+14; if(x>r.width-220) x=e.clientX-r.left-230; if(y>r.height-50) y=e.clientY-r.top-50; tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.hidden=true; }

cv.addEventListener('wheel', e=>{ e.preventDefault(); const w=toWorld(e); zoomAt(Math.exp(-e.deltaY*0.0015), w.sx, w.sy); }, {passive:false});

/* inspector events */
let histArmed=false;
function setPath(obj,path,val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=='object') o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=val; }
function getPath(obj,path){ return path.split('.').reduce((o,k)=>o?.[k],obj); }
function parseVal(el){ if(el.type==='checkbox') return el.checked; if(el.type==='range'||el.type==='number'||el.dataset.num) return parseFloat(el.value); return el.value; }
function applyProp(el){ const p=committed(sel); if(!p) return; let v=parseVal(el); if(typeof v==='number'&&!isFinite(v)) return;
  if(el.dataset.prop==='ohms') v=clamp(Math.round(v),1,1e7);
  if(!histArmed){ pushHist(); histArmed=true; }
  setPath(p.props, el.dataset.prop, v);
  if(/gpio\.[^.]+\.m$/.test(el.dataset.prop) && v==='pwm'){ const base=el.dataset.prop.replace(/\.m$/,''); const c=getPath(p.props,base); if(c.f==null) c.f=1000; if(c.d==null) c.d=50; }
  const out=insp.querySelector(`[data-out="${el.dataset.prop}"]`); if(out){ const u={volts:' V',tempC:' °C',dist:' cm'}[el.dataset.prop]; out.textContent = u ? (el.dataset.prop==='volts'?(+v).toFixed(1):v)+u : (+v).toFixed(1)+'%'; }

function tick(t){ const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  if(showFlow&&!reduceMotion) partsG.querySelectorAll('.flow').forEach(el=>{ el.style.strokeDashoffset=String((-(t/1000)*(+el.dataset.sp))%12); });
  partsG.querySelectorAll('[data-spin]').forEach(el=>{ const pid=+el.dataset.spin; const pos=el.dataset.mode==='pos'; const a=anim[pid]||(anim[pid]={ang:pos?90:0}); const S=sim.parts[pid]||{};
    if(pos){ if(S.target!=null){ const d=S.target-a.ang; a.ang += reduceMotion ? d : Math.sign(d)*Math.min(Math.abs(d),300*dt); } }
    else if(!reduceMotion) a.ang=(a.ang+(S.speed||0)*dt)%360;
    el.setAttribute('transform',`rotate(${pos?-a.ang:a.ang} ${el.dataset.cx} ${el.dataset.cy})`); });
  requestAnimationFrame(tick); }

const NET = k => sim.net(k);
const picoP = () => parts.find(p=>p.type==='pico');
const pinNet = (pc,n) => NET(nodeOf(pc,n-1));
const gpNet = (pc,name) => pinNet(pc,PICO_NUM[name]);
const gndNet = pc => pinNet(pc,38);
const gpCfg = (pc,name) => pc.props.gpio?.[name]||{m:'in'};
const SP = p => (p&&sim.parts[p.id])||{};
const ofType = t => parts.filter(p=>p.type===t);
function pinV(pc,n){ const v=sim.v(nodeOf(pc,n-1)), g=sim.v(`I${pc.id}.g`); return v==null||g==null?null:v-g; }
function withTemp(apply, read){ const restore=apply(); simulate(); let v; try{ v=read(); } finally { restore(); simulate(); } return v; }
function findSeries(src,gnd){ let best=null;
  for(const L of ofType('led')){ const la=NET(nodeOf(L,0)), lk=NET(nodeOf(L,1)); if(la===lk) continue;
    for(const R of ofType('resistor')){ const r0=NET(nodeOf(R,0)), r1=NET(nodeOf(R,1)); if(r0===r1) continue; const other=x=> r0===x?r1 : r1===x?r0 : null;
      let m=other(src); if(m!=null){ if(la===m&&lk===gnd) return {L,R,ok:true}; if(lk===m&&la===gnd) best=best||{L,R,ok:false}; }
      m=other(gnd); if(m!=null){ if(lk===m&&la===src) return {L,R,ok:true}; if(la===m&&lk===src) best=best||{L,R,ok:false}; } } }
  if(best) return best;
  for(const L of ofType('led')){ const la=NET(nodeOf(L,0)), lk=NET(nodeOf(L,1)); if((la===src&&lk===gnd)||(la===gnd&&lk===src)) return {L,R:null,ok:la===src,noR:true}; }
  return null; }
function wiringHint(def){ for(const p of parts){ if(!PNAME[p.type]) continue; const nm=PNAME[p.type];
    if(p.ends.some(a=>a.k==='f')) return `One leg of the ${nm} is not plugged into a hole. Drop it on a hole until its ring turns green.`;
    if(nodeOf(p,0)===nodeOf(p,1)) return `Both legs of the ${nm} are in the same 5-hole strip, so current skips it. Move one leg to a different column.`; }
  if(ofType('wire').some(w=>w.ends.some(a=>a.k==='f'))) return 'A wire end is loose. Drop it on a hole until its ring turns green.';
  return def; }

  {t:'LED faces the right way', f:c=>c.ser.ok || 'The LED is backwards. The long leg (anode, end 1) must face the + side and the flat side (cathode) faces GND. Drag its two ends to swap them.'},
  {t:'Resistor is between 150 Ω and 1 kΩ', f:c=>{ const o=c.ser.R.props.ohms; return (o>=150&&o<=1000) || `It is ${fmtOhm(o)}. ${o<150?'That lets too much current through.':'That makes the LED very dim.'} Try 220–330 Ω.`; }},
  {t:'LED is lit', f:c=>{ const L=c.ser.L; if(L.props.burnt) return 'The LED burned out. Select it, press Repair, and check the resistor.'; return SP(L).b>0.05 || 'The LED is not getting enough current yet.'; }} ];

      <p class="ch-goal note">Pick a task. Wire it any way you like, then press Check. The checker tests the electrical result, so any correct layout passes.</p>
      <div class="ch-sec">Build it</div><div class="ch-list">${CH.filter(c=>c.kind==='build').map(item).join('')}</div>
      <div class="ch-sec">Fix the fault</div><div class="ch-list">${CH.filter(c=>c.kind==='fix').map(item).join('')}</div>
      <div class="ch-sec">Measure it</div><div class="ch-list">${CH.filter(c=>c.kind==='measure').map(item).join('')}</div>
      <p class="note">${doneSet.size} of ${CH.length} completed. Progress saves in this browser.</p>`; return; }
  const d=chal.def, res=chal.res||STEPS[d.set].steps.map(s=>({t:s.t,st:''}));
  const next=CH[CH.indexOf(d)+1];
  el.innerHTML=`<div class="ch-head"><button class="linkbtn" data-cha="list">‹ All challenges</button><span><button class="iconbtn" data-cha="min" aria-label="Minimise">▴</button><button class="iconbtn" data-cha="close" aria-label="Close">✕</button></span></div>
    <span class="kind ${d.kind}">${d.kind==='fix'?'Fix the fault':d.kind==='measure'?'Measure it':'Build it'} · ${d.lvl}</span>
    <h3 style="margin:-4px 0 0;font-size:15px">${esc(d.title)}</h3><p class="ch-goal">${esc(d.goal)}</p>
    <ol class="steps">${res.map(r=>`<li class="${r.st}"><span>${esc(r.t)}</span>${r.hint?`<div class="ch-hint">${esc(r.hint)}</div>`:''}</li>`).join('')}</ol>
    ${STEPS[d.set].steps.some(x=>x.ask)?`<label class="ch-ask">Meter reading <input type="text" id="chAns" inputmode="decimal" autocomplete="off" placeholder="e.g. 4.50" value="${esc(chal.answer||'')}"></label>`:''}
    ${chal.won?`<div class="ch-win">${chal.usedSol?'This is a working solution. Press Restart and build it yourself to earn the tick.':'Challenge complete. Every check passed.'}</div>`:''}
    <div class="ch-acts"><button class="btn primary" data-cha="check">${chal.checked?'Check again':'Check my wiring'}</button>
      ${chal.won&&next?`<button class="btn" data-chs="${next.id}">Next challenge</button>`:''}
      <button class="btn" data-cha="restart">${d.kind==='measure'?'New values':'Restart'}</button>${d.sol?'<button class="btn" data-cha="sol">Show a solution</button>':''}</div>
    ${chal.checked&&!chal.won?'<p class="note">Checks re-run each time you change the circuit.</p>':''}`; }
$('#chcard').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.chs){ startChallenge(b.dataset.chs); return; }
  const a=b.dataset.cha;
  if(a==='close') chal=null; else if(a==='list') chal={min:false}; else if(a==='min') chal.min=true; else if(a==='max') chal.min=false;
  else if(a==='check'){ runCheck(); return; } else if(a==='restart'){ startChallenge(chal.def.id); return; }
  else if(a==='sol'){ const def=chal.def; chal=null; loadExample(def.sol); chal={def,res:null,checked:false,usedSol:true,min:false}; runCheck(); return; }

/* ================= schematic ================= */
let showSch=false, schV=true;
try{ showSch=localStorage.getItem('pico-bb-lab-sch')==='1'; }catch(e){}
const DESIG={resistor:'R',led:'D',thermistor:'TH',motor:'M',psu:'BT',pico:'U',driver:'U',reg:'U',servo:'SV',crservo:'SV',ir:'IR',micro:'SW',slide:'SW'};
const TWO=new Set(['resistor','led','thermistor','motor','psu']);
const DRV_PINS=['VIN+','VIN−','M1A','M1B','M2A','M2B','3V','GND','GP0','GP1','GP27','GP28'];
const BLK_TITLE={pico:'Pico 2 WH',driver:'Kitronik driver',reg:'LD1117-3.3',servo:'SG-5010 servo',crservo:'360° servo',ir:'IR distance',micro:'Micro switch',slide:'Slide switch'};
function schPins(p){ const n=i=>nodeOf(p,i);
  switch(p.type){
    case 'pico': return PICO_PINS.slice(1).map((nm,i)=>({nm,node:n(i),num:i+1,r:i>=20}));
    case 'driver': return DRV_PINS.map((nm,i)=>({nm,node:`T${p.id}.${i}`,r:i>=2&&i<=5}));
    case 'reg': return [{nm:'VIN',node:n(2)},{nm:'GND',node:n(0)},{nm:'VOUT',node:n(1),r:1}];
    case 'servo': case 'crservo': return [{nm:'V+',node:n(1)},{nm:'GND',node:n(0)},{nm:'SIG',node:n(2)}];
    case 'ir': return [{nm:'Vcc',node:n(2)},{nm:'GND',node:n(1)},{nm:'Vo',node:n(0),r:1}];
    case 'micro': return [{nm:'COM',node:n(0)},{nm:'NO',node:n(1),r:1},{nm:'NC',node:n(2),r:1}];
    case 'slide': return [{nm:'C',node:n(1)},{nm:'1',node:n(0),r:1},{nm:'3',node:n(2),r:1}];
    default: return [{nm:'1',node:n(0)},{nm:'2',node:n(1)}];
  } }
function schModel(){
  const items=parts.filter(p=>DESIG[p.type]); const des={}, cnt={};
  // nets for drawing: joined by jumper wires only, so switches and meters stay visible as parts
  const up=new Map(); const fnd=k=>{ while(up.has(k)&&up.get(k)!==k) k=up.get(k); return k; }; const uni=(a,b)=>{ a=fnd(a); b=fnd(b); if(a!==b) up.set(a,b); };
  for(const w of parts) if(w.type==='wire') uni(nodeOf(w,0),nodeOf(w,1));
  for(const p of parts){ if(p.type==='pico'){ const g=PICO_GND.map(n=>nodeOf(p,n-1)); g.forEach(k=>uni(k,g[0])); } if(p.type==='driver') uni(`T${p.id}.7`,`T${p.id}.1`); }
  const snet=fnd;
  for(const p of items){ const pre=DESIG[p.type]; cnt[pre]=(cnt[pre]||0)+1; des[p.id]=pre+cnt[pre]; }
  const conns=new Map(), repK=new Map(), blockNets=new Set(), pins={};
  for(const p of items){ pins[p.id]=schPins(p).map(x=>({...x,net:snet(x.node)}));
    for(const x of pins[p.id]){ conns.set(x.net,(conns.get(x.net)||0)+1); if(!repK.has(x.net)) repK.set(x.net,x.node); if(!TWO.has(p.type)) blockNets.add(x.net); } }
  const gnds=[]; const addG=(net,src)=>{ if(!gnds.find(g=>g.net===net)) gnds.push({net,src}); };
  for(const p of items){ const P=pins[p.id]; if(p.type==='pico') P.filter(x=>x.nm==='GND'||x.nm==='AGND').forEach(x=>addG(x.net,des[p.id])); if(p.type==='driver') addG(P[1].net,des[p.id]); }
  for(const p of items) if(p.type==='psu') addG(pins[p.id][1].net,des[p.id]);
  const names=new Map(), kind=new Map();
  gnds.forEach((g,i)=>{ names.set(g.net, i===0?'GND':`GND·${g.src}`); kind.set(g.net,'gnd'); });
  const setN=(net,nm,k)=>{ if(!names.has(net)){ names.set(net,nm); kind.set(net,k); } };
  const used=net=>(conns.get(net)||0)>1;
  for(const p of items){ const P=pins[p.id];
    if(p.type==='psu') setN(P[0].net,`+${+(+p.props.volts).toFixed(1)}V`,'pwr');
    if(p.type==='pico') for(const x of P) if(['3V3','VBUS','VSYS'].includes(x.nm)&&used(x.net)) setN(x.net,x.nm,'pwr');
    if(p.type==='reg') setN(P[2].net,'3V3 REG','pwr');
    if(p.type==='driver'){ setN(P[0].net,'VIN','pwr'); if(used(P[6].net)) setN(P[6].net,'3V3','pwr'); } }
  for(const p of items){ const P=pins[p.id];
    if(p.type==='pico') for(const x of P) if(x.nm.startsWith('GP')&&used(x.net)) setN(x.net,x.nm,'sig');
    if(p.type==='driver') P.forEach((x,i)=>{ if(i>=2&&i!==6&&i!==7&&used(x.net)) setN(x.net,x.nm,'sig'); }); }
  let nn=0; const nameOf=net=>{ if(!names.has(net)){ names.set(net,'N'+(++nn)); kind.set(net,'net'); } return names.get(net); };
  // series chains of two-terminal parts
  const edges=items.filter(p=>TWO.has(p.type)).map(p=>({p,a:pins[p.id][0].net,b:pins[p.id][1].net}));
  const isAnchor=net=> names.has(net)||blockNets.has(net)||conns.get(net)!==2;
  const usedE=new Set(), chains=[];
  const walk=(start,e0)=>{ const seq=[]; let cur=start, e=e0;
    while(e){ usedE.add(e); const nxt=e.a===cur?e.b:e.a; seq.push({e,from:cur,to:nxt}); cur=nxt; if(isAnchor(cur)) break; e=edges.find(x=>!usedE.has(x)&&(x.a===cur||x.b===cur)); }
    return {top:start,bot:cur,seq}; };
  for(const e of edges){ if(usedE.has(e)) continue; if(isAnchor(e.a)) chains.push(walk(e.a,e)); else if(isAnchor(e.b)) chains.push(walk(e.b,e)); }
  for(const e of edges) if(!usedE.has(e)) chains.push(walk(e.a,e));
  const rank=net=> kind.get(net)==='gnd'?0 : (conns.get(net)||0)<2?1 : kind.get(net)==='pwr'?4 : kind.get(net)==='sig'?3 : 2;
  for(const c of chains) if(rank(c.top)<rank(c.bot)){ c.seq=c.seq.reverse().map(x=>({e:x.e,from:x.to,to:x.from})); const t=c.top; c.top=c.bot; c.bot=t; }
  // blocks
  const blocks=items.filter(p=>!TWO.has(p.type)).map(p=>{ let P=pins[p.id];
    if(p.type==='pico'||p.type==='driver'){ const g=P.filter(x=>(x.nm==='GND'||x.nm==='AGND'||x.nm==='VIN−')&&used(x.net)); P=P.filter(x=>used(x.net)&&!['GND','AGND','VIN−'].includes(x.nm)); if(g.length) P.push({...g[0],nm:'GND',r:false}); }
    return {p, L:P.filter(x=>!x.r), R:P.filter(x=>x.r)}; });
  return {des,conns,repK,names,kind,nameOf,chains,blocks,gnds};
}
function schSym(e,x,y,flip,des){ const p=e.p, t=p.type, S=sim.parts[p.id]||{}; let s=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+14}" class="sw"/><line x1="${x}" y1="${y+42}" x2="${x}" y2="${y+56}" class="sw"/>`, val='';
  if(t==='resistor'){ s+=`<path d="M${x},${y+14} l6,2.3 l-12,4.6 l12,4.6 l-12,4.6 l12,4.6 l-12,4.6 l6,2.3" class="sw"/>`; val=p.props.burnt?'burnt':p.props.mystery?'? Ω':fmtOhm(p.props.ohms); }
  else if(t==='thermistor'){ s+=`<rect x="${x-6}" y="${y+14}" width="12" height="28" class="sw"/><path d="M${x-15},${y+38} h4 L${x+11},${y+18}" class="sw"/>`; val=`${fmtOhm(thermR(p.props.tempC))} @${p.props.tempC}°C`; }
  else if(t==='led'){ const C=LEDC[p.props.color], lit=(S.b||0)>0.05, fill=lit?`fill="${C.f}" fill-opacity="${(0.35+0.65*S.b).toFixed(2)}"`:'fill="none"';
    if(!flip) s+=`<line x1="${x}" y1="${y+14}" x2="${x}" y2="${y+18}" class="sw"/><path d="M${x-9},${y+18} h18 L${x},${y+34} Z" class="sw" ${fill}/><path d="M${x-9},${y+34} h18 M${x},${y+34} V${y+42}" class="sw"/>`;
    else s+=`<path d="M${x},${y+14} V${y+22} M${x-9},${y+22} h18" class="sw"/><path d="M${x-9},${y+38} h18 L${x},${y+22} Z" class="sw" ${fill}/><line x1="${x}" y1="${y+38}" x2="${x}" y2="${y+42}" class="sw"/>`;
    s+=`<path d="M${x+11},${y+24} l7,-5 m-3,0 h3 v3 M${x+11},${y+31} l7,-5 m-3,0 h3 v3" class="sw" style="stroke-width:1.1"/>`; val=p.props.burnt?'burnt':p.props.color+(flip?' (reversed!)':''); }
  else if(t==='motor'){ s+=`<circle cx="${x}" cy="${y+28}" r="13" class="sw"/><text x="${x}" y="${y+32}" text-anchor="middle" font-weight="700">M</text>`; val=S.badge&&S.badge!=='stopped'?S.badge:''; }
  else if(t==='psu'){ const pl=(yy,w,th)=>`<line x1="${x-w/2}" y1="${yy}" x2="${x+w/2}" y2="${yy}" class="sw" style="stroke-width:${th}"/>`;
    s+=`<line x1="${x}" y1="${y+14}" x2="${x}" y2="${y+24}" class="sw"/><line x1="${x}" y1="${y+32}" x2="${x}" y2="${y+42}" class="sw"/>`+(!flip? pl(y+24,26,1.6)+pl(y+32,13,3.2) : pl(y+24,13,3.2)+pl(y+32,26,1.6));
    s+=`<text x="${x-20}" y="${!flip?y+22:y+40}" text-anchor="middle" font-weight="700">+</text>`; val=`${(+p.props.volts).toFixed(1)} V`; }
  const lx = t==='led' ? x+22 : x+16;
  return `<g class="sp${p.id===sel?' sch-sel':''}" data-pid="${p.id}"><rect class="shit" x="${x-16}" y="${y+10}" width="${70}" height="36"/>${s}<text x="${lx}" y="${y+26}" class="sdes">${des[p.id]}</text>${val?`<text x="${lx}" y="${y+38}" class="sm">${esc(val)}</text>`:''}</g>`; }
function renderSchem(){
  const box=$('#schem'); box.hidden=!showSch; if(!showSch) return; const svg=$('#sch'), note=$('#schNote');
  if(!parts.some(p=>DESIG[p.type])){ svg.setAttribute('viewBox','0 0 420 80'); svg.innerHTML='<text x="210" y="44" text-anchor="middle" class="sm">Place parts and wire them up. The schematic draws itself here.</text>'; note.className='note'; note.textContent='Draws itself from your breadboard wiring. Labels with the same name are connected.'; return; }
  const M=schModel(); let s='', x0=1e9, y0=1e9, x1=-1e9, y1=-1e9; const bump=(ax,ay,bx,by)=>{ x0=Math.min(x0,ax); y0=Math.min(y0,ay); x1=Math.max(x1,bx); y1=Math.max(y1,by); };
  const volt=net=>{ if(!schV) return ''; const k=M.repK.get(net); const v=k!=null?sim.v(k):null; return v==null?'':(Math.abs(v)<0.005?'0.00':v.toFixed(2))+' V'; };
  const tw=t=>10+t.length*6.2;
  const gnd=(x,y,net)=>`<path d="M${x},${y} v8 M${x-10},${y+8} h20 M${x-6},${y+12} h12 M${x-2},${y+16} h4" class="sw"/>`+(M.gnds.length>1?`<text x="${x}" y="${y+27}" text-anchor="middle" class="sm">${esc(M.names.get(net))}</text>`:'');
  const nc=(x,y,dir)=>`<circle cx="${x}" cy="${y}" r="3" class="snc"/><text x="${x+dir*7}" y="${y+3}" text-anchor="${dir<0?'end':'start'}" class="snc-t">not connected</text>`;
  const tagAt=(net,cx,cy)=>{ const nm=M.nameOf(net), w=tw(nm); return {w, svg:`<rect x="${cx-w/2}" y="${cy-8}" width="${w}" height="16" rx="3" class="stag ${M.kind.get(net)}"/><text x="${cx}" y="${cy+3.5}" text-anchor="middle">${esc(nm)}</text>`}; };
  const endH=(net,x,y,dir)=>{ if((M.conns.get(net)||0)<2){ bump(x-90,y,x+90,y); return nc(x,y,dir); } if(M.kind.get(net)==='gnd'){ bump(x-12,y,x+12,y+28); return gnd(x,y,net); }
    const nm=M.nameOf(net), w=tw(nm), cx=x+dir*w/2, t=tagAt(net,cx,y), v=volt(net); bump(Math.min(x,x+dir*(w+50)),y-9,Math.max(x,x+dir*(w+50)),y+9);
    return t.svg+(v?`<text x="${x+dir*(w+4)}" y="${y+3.5}" text-anchor="${dir<0?'end':'start'}" class="sm">${v}</text>`:''); };
  const endV=(net,x,y,top)=>{ if((M.conns.get(net)||0)<2){ bump(x,y-4,x+80,y+4); return nc(x,y,1); } if(M.kind.get(net)==='gnd'&&!top){ bump(x-12,y,x+12,y+28); return gnd(x,y,net); }
    const v=volt(net), cy=top?y-10:y+10, t=tagAt(net,x,cy); bump(x-t.w/2,cy-9,x+t.w/2+50,cy+9); return t.svg+(v?`<text x="${x+t.w/2+4}" y="${cy+3.5}" class="sm">${v}</text>`:''); };
  // blocks column
  const bx=150, bw=128; let by=24;
  for(const b of M.blocks){ const p=b.p, S=sim.parts[p.id]||{}; const n=Math.max(b.L.length,b.R.length,1), h=40+n*18;
    let sub=''; if(p.type==='pico') sub=S.on?'running':'no power'; else if(p.type==='driver') sub=[S.m1,S.m2].filter(Boolean).join(' · '); else if(p.type==='micro') sub=(p._pressed||p.props.latched)?'pressed: COM–NO':'at rest: COM–NC';
    else if(p.type==='slide') sub=p.props.pos?'C–3':'C–1'; else if(p.type==='reg') sub=S.st==='reg'?'regulating':S.st==='drop'?'dropout':'no input'; else sub=S.badge||'';
    s+=`<g class="sp${p.id===sel?' sch-sel':''}" data-pid="${p.id}"><rect x="${bx}" y="${by}" width="${bw}" height="${h}" rx="5" class="sblk"/><text x="${bx+8}" y="${by+15}"><tspan class="sdes">${M.des[p.id]}</tspan> ${esc(BLK_TITLE[p.type])}</text><text x="${bx+8}" y="${by+28}" class="sm">${esc(sub)}</text>`;
    b.L.forEach((x,i)=>{ const y=by+44+i*18; s+=`<line x1="${bx-24}" y1="${y}" x2="${bx}" y2="${y}" class="sw"/><text x="${bx+6}" y="${y+3.5}" class="spn">${esc(x.nm)}</text>`+endH(x.net,bx-24,y,-1); });
    b.R.forEach((x,i)=>{ const y=by+44+i*18; s+=`<line x1="${bx+bw}" y1="${y}" x2="${bx+bw+24}" y2="${y}" class="sw"/><text x="${bx+bw-6}" y="${y+3.5}" text-anchor="end" class="spn">${esc(x.nm)}</text>`+endH(x.net,bx+bw+24,y,1); });
    if(!b.L.length&&!b.R.length) s+=`<text x="${bx+8}" y="${by+50}" class="snc-t">no pins wired yet</text>`;
    s+='</g>'; bump(bx,by,bx+bw,by+h); by+=h+36; }
  // chains, in columns
  const cx0 = M.blocks.length ? bx+bw+170 : 60, perRow=6, colW=128; let rowY=24, rowH=0;
  M.chains.forEach((c,i)=>{ const col=i%perRow; if(i&&col===0){ rowY+=rowH+50; rowH=0; } const x=cx0+col*colW; let y=rowY+22;
    s+=endV(c.top,x,y,true); s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+8}" class="sw"/>`; y+=8;
    c.seq.forEach((st,j)=>{ const flip = st.from!==st.e.a; s+=schSym(st.e,x,y,flip,M.des); y+=56;
      if(j<c.seq.length-1){ s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+12}" class="sw"/>`; const v=volt(st.to); if(v) s+=`<text x="${x-6}" y="${y+9}" text-anchor="end" class="sm">${v}</text>`; y+=12; } });
    s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+8}" class="sw"/>`; y+=8; s+=endV(c.bot,x,y,false); y+=30;
    bump(x-40,rowY,x+90,y); rowH=Math.max(rowH,y-rowY); });
  const pad=16; svg.setAttribute('viewBox',`${x0-pad} ${y0-pad} ${x1-x0+pad*2} ${y1-y0+pad*2}`); svg.innerHTML=s;
  const ncN=[...M.conns.values()].length; void ncN;
  if(M.gnds.length>1){ note.className='note alert'; note.textContent=`${M.gnds.length} separate grounds that are not joined. Parts on different grounds cannot share signals.`; }
  else { note.className='note'; note.textContent='Draws itself from your breadboard wiring. Labels with the same name are connected.'; }
}

/* ================= boot ================= */
function boot(){
  renderDefs(); renderBoard(); renderBin();
  let loaded=false; try{ const s=localStorage.getItem('pico-bb-lab-v1'); if(s){ const o=JSON.parse(s); if(Array.isArray(o.parts)&&o.parts.every(p=>DEF[p.type])){ parts=o.parts; nextId=o.nextId||1+Math.max(0,...parts.map(p=>p.id)); loaded=true; } } }catch(e){}
  if(!loaded){ nextId=1; parts=EX.blink.build(); }
  renderInspector(); commit(); fitView(); requestAnimationFrame(tick);
  new ResizeObserver(()=>{ if(!stage.dataset.fitted){ fitView(); } }).observe(stage);
  setTimeout(()=>{ stage.dataset.fitted='1'; }, 600);
}
boot();
